name: Patch Face Smoke Container Lock

on:
  push:
    branches:
      - refactor/full-code-cn-comments
    paths:
      - scripts/patch_face_smoke_container_lock.py
      - .github/workflows/patch_face_smoke_container_lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/full-code-cn-comments
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply container-aware shading lock patch
        run: python scripts/patch_face_smoke_container_lock.py

      - name: Compile tests
        run: python -m compileall -q tests

      - name: Validate Face module smoke contract
        run: python tests/face_modules_maya2023_smoke_contract_test.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Remove one-time patch script
        run: git rm scripts/patch_face_smoke_container_lock.py

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests

          if git diff --cached --quiet; then
            echo "No Face smoke patch changes required."
            exit 0
          fi

          git commit -m "test: handle container unpublished locks in face smoke"
          git push origin HEAD:refactor/full-code-cn-comments
