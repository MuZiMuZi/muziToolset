name: Add Cheek Guide Extension

on:
  push:
    branches:
      - refactor/full-code-cn-comments
    paths:
      - scripts/add_cheek_guide_extension.py
      - .github/workflows/add_cheek_guide_extension.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/full-code-cn-comments
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Cheek Guide extension
        run: python scripts/add_cheek_guide_extension.py

      - name: Compile runtime and tests
        run: python -m compileall -q systems tests

      - name: Validate Face lifecycle contract
        run: python tests/face_module_lifecycle_contract_test.py

      - name: Validate Face Maya smoke contract
        run: python tests/face_modules_maya2023_smoke_contract_test.py

      - name: Validate runtime step comments
        run: python scripts/annotate_runtime_steps.py --check

      - name: Validate public runtime docstrings
        run: python scripts/normalize_runtime_docstrings.py --check

      - name: Check whitespace errors
        run: git diff --check

      - name: Remove one-time migration script
        run: git rm scripts/add_cheek_guide_extension.py

      - name: Commit validated Cheek Guide extension
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems tests scripts

          if git diff --cached --quiet; then
            echo "No Cheek Guide extension changes required."
            exit 0
          fi

          git commit -m "feat: add formal cheek guide schema"
          git push origin HEAD:refactor/full-code-cn-comments
