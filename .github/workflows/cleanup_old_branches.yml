name: Cleanup Old Branches

on:
  push:
    branches:
      - refactor/full-code-cn-comments
    paths:
      - .github/workflows/cleanup_old_branches.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current development branch
        uses: actions/checkout@v4
        with:
          ref: refactor/full-code-cn-comments
          fetch-depth: 0

      - name: Delete confirmed obsolete remote branches
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            "cmds-archive-2026-08-31"
            "controller-builder-refactor-20260901"
            "docs/apple-style-reference"
            "docs/apple-style-reference-v2"
            "face-teeth-rig-20260901"
            "feat/toolbox-tool-modes"
            "hierarchy-refactor-20260831"
            "refactor/rig-base"
            "refactor/runtime-docstring-standard"
            "scene-utils-refactor-20260901"
            "step01-face-setup-refactor"
            "step02-face-guide-refactor"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              git push origin --delete "${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done

      - name: Verify preserved branches
        shell: bash
        run: |
          set -euo pipefail

          for branch in main refactor/full-code-cn-comments pymel-archive-2026-08-31; do
            git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null
            echo "Preserved: ${branch}"
          done

      - name: Remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm .github/workflows/cleanup_old_branches.yml
          git add .github/workflows/cleanup_old_branches.yml
          git commit -m "chore: remove completed branch cleanup workflow"
          git push origin HEAD:refactor/full-code-cn-comments
