name: Finalize Face Module Docstrings

on:
  push:
    branches:
      - refactor/full-code-cn-comments
    paths:
      - .github/workflows/finalize_face_module_docstrings.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/full-code-cn-comments
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Normalize public runtime docstrings
        run: python scripts/normalize_runtime_docstrings.py --write

      - name: Refine generic Chinese summaries and returns
        run: python scripts/refine_runtime_generic_docs.py --write

      - name: Refine Maya rigging terminology
        run: python scripts/refine_runtime_docstring_semantics.py --write

      - name: Validate Python compile
        run: python -m compileall -q app core systems tools ui tests __init__.py config.py

      - name: Validate runtime step comments
        run: python scripts/annotate_runtime_steps.py --check

      - name: Validate public runtime docstrings
        run: python scripts/normalize_runtime_docstrings.py --check

      - name: Validate documentation specificity
        run: python scripts/refine_runtime_generic_docs.py --check

      - name: Validate rigging terminology
        run: python scripts/refine_runtime_docstring_semantics.py --check

      - name: Validate Face architecture contracts
        run: |
          python tests/face_module_lifecycle_contract_test.py
          python tests/face_module_legacy_gate_test.py
          python tests/face_modules_maya2023_smoke_contract_test.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit normalized Face documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __init__.py config.py app core systems tools ui

          if git diff --cached --quiet; then
            echo "Runtime Docstrings are already normalized."
            exit 0
          fi

          git commit -m "docs: finalize face module chinese api docs"
          git push origin HEAD:refactor/full-code-cn-comments
