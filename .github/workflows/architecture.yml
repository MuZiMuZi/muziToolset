name: architecture

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  static-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install-test-dependencies
        run: python -m pip install pytest
      - name: run-static-architecture-tests
        run: python -m pytest -q tests/test_architecture.py
