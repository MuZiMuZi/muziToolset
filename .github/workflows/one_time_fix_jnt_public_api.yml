name: One Time Fix Jnt Public API

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-jnt-public-api:
    if: github.event.head_commit.message == 'Run Jnt public API fix'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fix Jnt public export
        shell: python
        run: |
          from pathlib import Path

          file_path = Path("core/jnt_utils.py")
          source = file_path.read_text(encoding="utf-8")

          old_text = '    "Joint",\n]'
          new_text = '    "Jnt",\n]'

          if source.count(old_text) != 1:
              raise RuntimeError("core/jnt_utils.py __all__ Joint export match count is not 1")

          source = source.replace(old_text, new_text, 1)
          file_path.write_text(source, encoding="utf-8", newline="\n")

      - name: Verify Jnt contracts
        run: |
          python -m compileall -q core tests
          python tests/jnt_naming_contract_test.py
          python tests/core_public_api_gate_test.py

      - name: Remove trigger and commit
        run: |
          rm -f scripts/_jnt_api_fix_trigger.txt
          git config user.name "MuZiMuZi"
          git config user.email "114722174+MuZiMuZi@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Jnt public API export"
          git push origin HEAD:main
