name: Validate Runtime Chinese Documentation

on:
  push:
    branches:
      - refactor/full-code-cn-comments
    paths-ignore:
      - docs/development/runtime-step-comment-audit.md
      - docs/development/runtime-compile-audit.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refactor/full-code-cn-comments
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------------------------------------------------
      # Step 01：生成复杂 Runtime 函数的中文步骤注释审计清单
      # 这里只做审计，不再自动改写任何 Runtime 源码。
      # -----------------------------------------------------------------------
      - name: Generate runtime step comment audit
        run: python scripts/audit_runtime_step_comments.py --write-report

      # -----------------------------------------------------------------------
      # Step 02：保存最新审计清单，方便按 Core → Systems → Tools → UI 逐项整理
      # -----------------------------------------------------------------------
      - name: Commit runtime step comment audit
        shell: bash
        run: |
          if git diff --quiet -- docs/development/runtime-step-comment-audit.md; then
            echo "Runtime step comment audit is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/development/runtime-step-comment-audit.md
            git commit -m "docs: update runtime step comment audit"
            git push origin HEAD:refactor/full-code-cn-comments
          fi

      # -----------------------------------------------------------------------
      # Step 03：静态编译全部 Runtime Python，确保注释整理没有破坏语法
      # -----------------------------------------------------------------------
      - name: Validate runtime compile
        shell: bash
        run: python -m compileall -q app core systems tools ui __init__.py config.py

      # -----------------------------------------------------------------------
      # Step 04：检查所有公开 Runtime API 的中文 Docstring 结构
      # -----------------------------------------------------------------------
      - name: Validate public runtime docstrings
        run: python scripts/normalize_runtime_docstrings.py --check

      # -----------------------------------------------------------------------
      # Step 05：检查 Maya / Rigging 参数语义质量
      # -----------------------------------------------------------------------
      - name: Validate rigging terminology quality
        run: python scripts/refine_runtime_docstring_semantics.py --check

      # -----------------------------------------------------------------------
      # Step 06：检查源码空白格式
      # -----------------------------------------------------------------------
      - name: Check whitespace errors
        run: git diff --check
