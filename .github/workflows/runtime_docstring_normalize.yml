name: Normalize Runtime Documentation

on:
  push:
    branches:
      - refactor/full-code-cn-comments
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refactor/full-code-cn-comments
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------------------------------------------------
      # Step 01：统一补齐 Runtime 公开 API 中文 Docstring
      # -----------------------------------------------------------------------
      - name: Normalize public runtime docstrings
        run: python scripts/normalize_runtime_docstrings.py --write

      # -----------------------------------------------------------------------
      # Step 02：进一步修正 Maya / Rigging 参数语义
      # -----------------------------------------------------------------------
      - name: Refine Maya and rigging parameter semantics
        run: python scripts/refine_runtime_docstring_semantics.py --write

      # -----------------------------------------------------------------------
      # Step 03：生成复杂函数中文步骤注释审计报告
      # -----------------------------------------------------------------------
      - name: Audit runtime step comments
        run: python scripts/audit_runtime_step_comments.py --write-report

      # -----------------------------------------------------------------------
      # Step 04：清理行尾空白，保证源码格式稳定
      # -----------------------------------------------------------------------
      - name: Normalize runtime whitespace
        shell: bash
        run: |
          find app core systems tools ui -type f -name '*.py' -print0 | xargs -0 sed -i 's/[[:space:]]\+$//'
          sed -i 's/[[:space:]]\+$//' __init__.py config.py

      # -----------------------------------------------------------------------
      # Step 05：再次检查 Docstring 与绑定术语契约
      # -----------------------------------------------------------------------
      - name: Validate public runtime docstrings
        run: python scripts/normalize_runtime_docstrings.py --check

      - name: Validate rigging terminology quality
        run: python scripts/refine_runtime_docstring_semantics.py --check

      # -----------------------------------------------------------------------
      # Step 06：静态编译全部 Runtime Python，防止整理产生语法错误
      # -----------------------------------------------------------------------
      - name: Compile runtime source
        shell: bash
        run: |
          python -m compileall -q app core systems tools ui __init__.py config.py

      - name: Check whitespace errors
        run: git diff --check

      # -----------------------------------------------------------------------
      # Step 07：把自动整理结果和审计报告提交回 Refactor Branch
      # -----------------------------------------------------------------------
      - name: Commit normalized runtime documentation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Runtime documentation already satisfies the standard."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add __init__.py config.py app core systems tools ui docs/development/runtime-step-comment-audit.md
          git commit -m "docs: normalize runtime chinese api comments"
          git push origin HEAD:refactor/full-code-cn-comments
