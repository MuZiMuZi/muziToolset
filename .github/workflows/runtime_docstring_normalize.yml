name: Normalize Runtime Documentation

on:
  push:
    branches:
      - refactor/full-code-cn-comments
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refactor/full-code-cn-comments
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -----------------------------------------------------------------------
      # Step 01：统一补齐 Runtime 公开 API 中文 Docstring
      # -----------------------------------------------------------------------
      - name: Normalize public runtime docstrings
        shell: bash
        run: python scripts/normalize_runtime_docstrings.py --write || true

      # -----------------------------------------------------------------------
      # Step 02：进一步修正 Maya / Rigging 参数语义
      # -----------------------------------------------------------------------
      - name: Refine Maya and rigging parameter semantics
        shell: bash
        run: python scripts/refine_runtime_docstring_semantics.py --write || true

      # -----------------------------------------------------------------------
      # Step 03：生成复杂函数中文步骤注释审计报告
      # -----------------------------------------------------------------------
      - name: Audit runtime step comments
        shell: bash
        run: |
          mkdir -p docs/development
          if ! python scripts/audit_runtime_step_comments.py --write-report; then
            cat > docs/development/runtime-step-comment-audit.md <<'EOF'
          # Runtime 中文步骤注释审计

          ⚠️ 本次自动审计遇到异常，后续人工整理时继续修复。
          EOF
          fi

      # -----------------------------------------------------------------------
      # Step 04：清理行尾空白
      # -----------------------------------------------------------------------
      - name: Normalize runtime whitespace
        shell: bash
        run: |
          find app core systems tools ui -type f -name '*.py' -print0 | xargs -0 sed -i 's/[[:space:]]\+$//'
          sed -i 's/[[:space:]]\+$//' __init__.py config.py

      # -----------------------------------------------------------------------
      # Step 05：先记录完整 Compile 输出，不在这里中断工作流
      # -----------------------------------------------------------------------
      - name: Capture runtime compile audit
        shell: bash
        run: |
          mkdir -p docs/development
          {
            echo "Runtime Compile Audit"
            echo "====================="
            echo
            python -m compileall -q app core systems tools ui __init__.py config.py
          } > docs/development/runtime-compile-audit.txt 2>&1 || true

      - name: Check whitespace errors
        run: git diff --check

      # -----------------------------------------------------------------------
      # Step 06：把自动整理结果、步骤审计和 Compile Audit 提交到 Refactor Branch
      # -----------------------------------------------------------------------
      - name: Commit normalized runtime documentation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Runtime documentation already satisfies the write phase."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add __init__.py config.py app core systems tools ui \
              docs/development/runtime-step-comment-audit.md \
              docs/development/runtime-compile-audit.txt
            git commit -m "docs: normalize runtime chinese api comments"
            git push origin HEAD:refactor/full-code-cn-comments
          fi

      # -----------------------------------------------------------------------
      # Step 07：提交后再进行严格 Python Compile
      # -----------------------------------------------------------------------
      - name: Validate runtime compile
        shell: bash
        run: python -m compileall -q app core systems tools ui __init__.py config.py

      # -----------------------------------------------------------------------
      # Step 08：严格检查 Docstring 与绑定术语
      # -----------------------------------------------------------------------
      - name: Validate public runtime docstrings
        run: python scripts/normalize_runtime_docstrings.py --check

      - name: Validate rigging terminology quality
        run: python scripts/refine_runtime_docstring_semantics.py --check
