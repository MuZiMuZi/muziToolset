name: Build MuziTools Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # -------------------------------------------------------------------------
    # 把 Pages 是否已启用暴露给 Deploy Job。
    # -------------------------------------------------------------------------
    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      # -----------------------------------------------------------------------
      # 步骤 1：检查正式代码是否重新引用退休 CamelCase Core 入口。
      # -----------------------------------------------------------------------
      - name: Check Core import style
        run: python tests/core_import_style_test.py

      # -----------------------------------------------------------------------
      # 步骤 2：验证 API Reference Generator 本身。
      #
      # 该测试使用临时项目验证：
      #   - Package 页面；
      #   - Function / Class / Method；
      #   - 参数表；
      #   - Returns / Raises / Example；
      #   - SUMMARY.md 导航。
      # -----------------------------------------------------------------------
      - name: Test API reference generator
        run: python tests/docs_reference_generator_test.py

      # -----------------------------------------------------------------------
      # 步骤 3：验证正式 Runtime 源码全部进入 API 文档范围。
      #
      # 正式范围：
      #   __init__.py
      #   config.py
      #   app/**/*.py
      #   core/**/*.py
      #   systems/**/*.py
      #   tools/**/*.py
      #   ui/**/*.py
      #
      # 只要新增正式 Python 文件，就必须能映射到唯一 API Markdown 页面。
      # -----------------------------------------------------------------------
      - name: Check runtime API documentation coverage
        run: python tests/docs_runtime_api_coverage_test.py

      # -----------------------------------------------------------------------
      # 步骤 4：使用 AST 生成完整 Runtime API Reference。
      #
      # 生成器不会 import muziToolset / maya.cmds，因此 Linux Runner 不需要 Maya。
      # 同时生成 docs/SUMMARY.md，供 mkdocs-literate-nav 创建源码树侧边栏。
      # -----------------------------------------------------------------------
      - name: Generate API reference
        run: python scripts/generate_mkdocs_reference.py

      # -----------------------------------------------------------------------
      # 步骤 5：严格构建 MkDocs。
      #
      # --strict 会把断链、缺页、无效导航和配置问题升级为 CI Failure。
      # -----------------------------------------------------------------------
      - name: Build MkDocs site
        run: mkdocs build --strict

      # -----------------------------------------------------------------------
      # 步骤 6：仅在非 PR 构建中检查 GitHub Pages 是否已经启用。
      #
      # 200 -> Pages 已启用，可以部署。
      # 404 -> Pages 尚未启用，安全跳过 Deploy。
      # -----------------------------------------------------------------------
      - name: Check GitHub Pages status
        id: pages_status
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          http_status=$(curl \
            --silent \
            --show-error \
            --output /tmp/muzitools_pages_status.json \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pages")

          if [ "${http_status}" = "200" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "GitHub Pages is enabled. The deploy job will run."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "GitHub Pages is not enabled yet (HTTP ${http_status})."
            echo "MkDocs build is valid; Pages deployment will be skipped safely."
          fi

      # -----------------------------------------------------------------------
      # 步骤 7：Main Push 时上传 Pages Artifact。
      # -----------------------------------------------------------------------
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
