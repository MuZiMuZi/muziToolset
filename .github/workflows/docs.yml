name: Build MuziTools Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      # -----------------------------------------------------------------------
      # 步骤 1：检查正式 Core 是否重新引用退休 CamelCase 入口。
      # -----------------------------------------------------------------------
      - name: Check Core import style
        run: python tests/core_import_style_test.py

      - name: Check Jnt naming contract
        run: python tests/jnt_naming_contract_test.py

      # -----------------------------------------------------------------------
      # 步骤 2：禁止 0.4 已退休 Rig 架构重新出现。
      # -----------------------------------------------------------------------
      - name: Check Rig architecture migration
        run: python tests/rig_architecture_gate_test.py

      # -----------------------------------------------------------------------
      # 步骤 3：验证 RigBase Naming Contract。
      # -----------------------------------------------------------------------
      - name: Check RigBase contract
        run: python tests/rig_base_contract_test.py

      # -----------------------------------------------------------------------
      # 步骤 4：验证 ModuleBase / RigModuleBase Lifecycle Contract。
      # -----------------------------------------------------------------------
      - name: Check ModuleBase contract
        run: python tests/module_base_contract_test.py

      # -----------------------------------------------------------------------
      # 步骤 5：检查 Core Generic 能力是否保持唯一正式实现。
      # -----------------------------------------------------------------------
      - name: Check Core single source
        run: python tests/core_single_source_gate_test.py

      # -----------------------------------------------------------------------
      # 步骤 6：检查 Core __all__ 是否只导出真实存在的 Public API。
      # -----------------------------------------------------------------------
      - name: Check Core public API exports
        run: python tests/core_public_api_gate_test.py

      # -----------------------------------------------------------------------
      # 步骤 7：禁止 System / Tool / UI 重复 Core Helper。
      # -----------------------------------------------------------------------
      - name: Check upper layer Core reuse
        run: python tests/system_core_reuse_gate_test.py

      # -----------------------------------------------------------------------
      # 步骤 8：静态验证 Maya 2023 Runtime Smoke Runner 契约。
      # -----------------------------------------------------------------------
      - name: Check Maya 2023 smoke contract
        run: python tests/maya2023_smoke_contract_test.py

      # -----------------------------------------------------------------------
      # 步骤 9：检查正式公开 API Docstring。
      # -----------------------------------------------------------------------
      - name: Check runtime docstring standard
        run: python scripts/normalize_runtime_docstrings.py --check

      # -----------------------------------------------------------------------
      # 步骤 10：检查 Maya / Rigging 术语质量。
      # -----------------------------------------------------------------------
      - name: Check Maya and rigging terminology quality
        run: python scripts/refine_runtime_docstring_semantics.py --check

      # -----------------------------------------------------------------------
      # 步骤 11：验证 API Reference Generator。
      # -----------------------------------------------------------------------
      - name: Test API reference generator
        run: python tests/docs_reference_generator_test.py

      # -----------------------------------------------------------------------
      # 步骤 12：验证全部 Runtime Python 文件都有 API 页面。
      # -----------------------------------------------------------------------
      - name: Check runtime API documentation coverage
        run: python tests/docs_runtime_api_coverage_test.py

      # -----------------------------------------------------------------------
      # 步骤 13：生成 Runtime API Reference 和源码树导航。
      # -----------------------------------------------------------------------
      - name: Generate API reference
        run: python scripts/generate_mkdocs_reference.py

      # -----------------------------------------------------------------------
      # 步骤 14：统一生成 API 布局。
      # -----------------------------------------------------------------------
      - name: Refine generated API layout
        run: python scripts/refine_generated_reference.py

      # -----------------------------------------------------------------------
      # 步骤 15：检查 Callable Purpose Section。
      # -----------------------------------------------------------------------
      - name: Validate callable purpose sections
        run: python scripts/refine_generated_callable_layout.py --check

      # -----------------------------------------------------------------------
      # 步骤 16：检查生成 API 页面布局。
      # -----------------------------------------------------------------------
      - name: Validate generated API page layout
        run: python tests/docs_generated_layout_test.py

      # -----------------------------------------------------------------------
      # 步骤 17：扩展用户手册 SUMMARY 导航。
      # -----------------------------------------------------------------------
      - name: Expand user manual navigation
        run: python scripts/extend_docs_summary.py

      # -----------------------------------------------------------------------
      # 步骤 18：检查 README 与导航一致性。
      # -----------------------------------------------------------------------
      - name: Check README and navigation consistency
        run: python tests/docs_readme_navigation_test.py

      # -----------------------------------------------------------------------
      # 步骤 19：严格构建 MkDocs。
      # -----------------------------------------------------------------------
      - name: Build MkDocs site
        run: mkdocs build --strict

      # -----------------------------------------------------------------------
      # 步骤 20：检查 GitHub Pages 是否启用。
      # -----------------------------------------------------------------------
      - name: Check GitHub Pages status
        id: pages_status
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          http_status=$(curl \
            --silent \
            --show-error \
            --output /tmp/muzitools_pages_status.json \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pages")

          if [ "${http_status}" = "200" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "GitHub Pages is enabled. The deploy job will run."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "GitHub Pages is not enabled yet (HTTP ${http_status})."
            echo "MkDocs build is valid; Pages deployment will be skipped safely."
          fi

      # -----------------------------------------------------------------------
      # 步骤 21：上传 Pages Artifact。
      # -----------------------------------------------------------------------
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
