name: Build MuziTools Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # -------------------------------------------------------------------------
    # 把 Pages 是否已启用暴露给 Deploy Job。
    #
    # 仓库还没有在 Settings -> Pages 中启用 Pages 时，GitHub Pages API 会返回 404。
    # 这不属于 MkDocs / 文档代码错误，因此不应该把每次正常 Push 都标记成 CI Failed。
    # -------------------------------------------------------------------------
    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      # -----------------------------------------------------------------------
      # 步骤 1：检查正式代码是否仍引用旧 CamelCase Core 兼容入口。
      #
      # 该测试只解析 Python AST，不 import Maya，因此可以在 Linux Runner 上执行。
      # 一旦正式代码重新写回 attrUtils / hierarchyUtils / jointUtils / nameUtils，
      # Workflow 会直接失败，防止旧入口重新进入正式架构。
      # -----------------------------------------------------------------------
      - name: Check Core import style
        run: python tests/core_import_style_test.py

      # -----------------------------------------------------------------------
      # 步骤 2：使用 AST 自动生成 Core / Tools / Systems API Reference。
      #
      # 生成器不会 import muziToolset，因此 Linux Runner 不需要安装 Maya。
      # -----------------------------------------------------------------------
      - name: Generate API reference
        run: python scripts/generate_mkdocs_reference.py

      # -----------------------------------------------------------------------
      # 步骤 3：严格构建 MkDocs。
      #
      # --strict 会把无效配置、断链、缺失页面等文档问题升级为 CI Failure。
      # 这是 Docs CI 最重要的质量门槛，无论 Pages 是否开启都必须执行并通过。
      # -----------------------------------------------------------------------
      - name: Build MkDocs site
        run: mkdocs build --strict

      # -----------------------------------------------------------------------
      # 步骤 4：仅在非 PR 构建中检查 GitHub Pages 是否已经启用。
      #
      # GET /repos/{owner}/{repo}/pages：
      #   200 -> Pages 已启用，可以执行 deploy-pages；
      #   404 -> Pages 尚未启用，Deploy Job 安全跳过。
      #
      # 注意：这里故意不让 404 导致 Step 失败。
      # -----------------------------------------------------------------------
      - name: Check GitHub Pages status
        id: pages_status
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          http_status=$(curl \
            --silent \
            --show-error \
            --output /tmp/muzitools_pages_status.json \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pages")

          if [ "${http_status}" = "200" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "GitHub Pages is enabled. The deploy job will run."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "GitHub Pages is not enabled yet (HTTP ${http_status})."
            echo "MkDocs build is valid; Pages deployment will be skipped safely."
          fi

      # -----------------------------------------------------------------------
      # 步骤 5：Main Push 时上传 Pages Artifact。
      #
      # 即使 Pages 尚未启用，上传 Artifact 本身也可以成功，并且便于检查生成站点。
      # -----------------------------------------------------------------------
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # -------------------------------------------------------------------------
    # 只有同时满足下面两个条件才真正部署：
    #   1. 不是 Pull Request；
    #   2. 仓库 Pages API 确认已经启用。
    #
    # 尚未开启 Pages 时 Job 会显示为 Skipped，而整个 Docs Workflow 仍然保持 Success。
    # -------------------------------------------------------------------------
    if: >-
      github.event_name != 'pull_request' &&
      needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
