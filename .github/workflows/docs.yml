name: Build MuziTools Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      pages_enabled: ${{ steps.pages_status.outputs.enabled }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      # -----------------------------------------------------------------------
      # 步骤 1：检查正式代码是否重新引用退休 CamelCase Core 入口。
      # -----------------------------------------------------------------------
      - name: Check Core import style
        run: python tests/core_import_style_test.py

      # -----------------------------------------------------------------------
      # 步骤 2：验证 API Reference Generator 本身。
      # -----------------------------------------------------------------------
      - name: Test API reference generator
        run: python tests/docs_reference_generator_test.py

      # -----------------------------------------------------------------------
      # 步骤 3：验证全部正式 Runtime Python 文件都能映射到独立 API 页面。
      # -----------------------------------------------------------------------
      - name: Check runtime API documentation coverage
        run: python tests/docs_runtime_api_coverage_test.py

      # -----------------------------------------------------------------------
      # 步骤 4：使用 AST 生成完整 Runtime API Reference 和源码树导航。
      # -----------------------------------------------------------------------
      - name: Generate API reference
        run: python scripts/generate_mkdocs_reference.py

      # -----------------------------------------------------------------------
      # 步骤 5：在自动生成的 SUMMARY.md 中加入人工维护的任务型用户手册页面。
      #
      # API 源码树仍由 Generator 自动维护；这里仅扩展用户手册导航。
      # -----------------------------------------------------------------------
      - name: Expand user manual navigation
        run: python scripts/extend_docs_summary.py

      # -----------------------------------------------------------------------
      # 步骤 6：严格构建 MkDocs。
      # -----------------------------------------------------------------------
      - name: Build MkDocs site
        run: mkdocs build --strict

      # -----------------------------------------------------------------------
      # 步骤 7：检查 GitHub Pages 是否已经启用。
      # -----------------------------------------------------------------------
      - name: Check GitHub Pages status
        id: pages_status
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          http_status=$(curl \
            --silent \
            --show-error \
            --output /tmp/muzitools_pages_status.json \
            --write-out "%{http_code}" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/pages")

          if [ "${http_status}" = "200" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "GitHub Pages is enabled. The deploy job will run."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "GitHub Pages is not enabled yet (HTTP ${http_status})."
            echo "MkDocs build is valid; Pages deployment will be skipped safely."
          fi

      # -----------------------------------------------------------------------
      # 步骤 8：上传 Pages Artifact。
      # -----------------------------------------------------------------------
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
