name: One Time Corrected Jnt Migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-jnt-naming:
    if: github.event.head_commit.message == 'Run corrected Jnt migration'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run corrected migration
        run: python scripts/_redo_jnt_migration.py

      - name: Remove one-time migration files
        run: |
          rm -f scripts/_redo_jnt_migration.py
          rm -f scripts/_jnt_migration_trigger.txt

      - name: Verify no migration placeholders remain
        run: |
          if grep -R --line-number --exclude-dir=.git --exclude-dir=legacy_reference --exclude='*.ma' '__MUZI_MAYA_.*PROTECTED_' app core systems tools ui tests scripts __init__.py config.py; then
            echo 'Found unresolved Maya protection placeholders.'
            exit 1
          fi

      - name: Commit corrected migration
        run: |
          git config user.name "MuZiMuZi"
          git config user.email "114722174+MuZiMuZi@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete corrected Joint to Jnt naming migration"
          git push origin HEAD:main
