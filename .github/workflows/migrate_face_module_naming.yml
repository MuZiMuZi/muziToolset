name: Migrate Face Module Naming

on:
  push:
    branches:
      - refactor/full-code-cn-comments
    paths:
      - scripts/migrate_face_module_naming.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refactor/full-code-cn-comments

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Face module naming migration
        run: python scripts/migrate_face_module_naming.py

      - name: Compile runtime and tests
        run: python -m compileall -q app core systems tools ui tests __init__.py config.py

      - name: Test Face module lifecycle contract
        run: python tests/face_module_lifecycle_contract_test.py

      - name: Check whitespace
        run: git diff --check

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Standardize Face module snake_case naming"
          git push origin HEAD:refactor/full-code-cn-comments
