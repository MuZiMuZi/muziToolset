name: Apply Face Namespace Hierarchy Fix

on:
  push:
    branches:
      - refactor/full-code-cn-comments
    paths:
      - .github/workflows/fix_face_namespace_hierarchy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/full-code-cn-comments
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 触发后只修改 FaceBase.ensure_hierarchy()，不会改其它业务逻辑。
      - name: Apply Face hierarchy path fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("systems/face/face_base.py")
          source = path.read_text(encoding="utf-8")

          old = '''    def ensure_hierarchy(self):
        u\"\"\"

                确保 Face Rig 基础 Group 存在，并修正到正式 Parent 层级。

                Returns:
                    bool:
                        当前操作成功或目标状态满足要求时返回 True，否则返回 False。

        \"\"\"
        face_master_group = hierarchy_utils.ensure_group(
            self.face_master_grp
        )

        face_model_group = hierarchy_utils.ensure_group(
            self.face_model_grp,
            parent_node=face_master_group
        )

        for group_name in self.type_groups:
            hierarchy_utils.ensure_group(
                group_name,
                parent_node=face_master_group
            )

        for group_name in self.model_groups:
            hierarchy_utils.ensure_group(
                group_name,
                parent_node=face_model_group
            )

        return True
'''

          new = '''    def ensure_hierarchy(self):
        u\"\"\"
        确保 Face Rig 基础 Group 存在，并保存 Maya 返回的真实 DAG Long Path。

        配置模块只负责提供标准名称；真正创建或查询 Maya Group 后，必须把
        ``hierarchy_utils.ensure_group()`` 返回的 Long Path 写回当前 FaceBase
        实例。这样 Namespace、同名 DAG 和 Rebuild 场景都继续使用唯一场景路径。

        Returns:
            bool:
                Face 基础层级全部存在、Parent 正确，并完成真实路径缓存后返回 True。
        \"\"\"
        # -------------------------------------------------------------------------
        # Step 01：创建 Face Master，并保存 Maya 实际返回的唯一 Long Path
        # -------------------------------------------------------------------------
        self.face_master_grp = hierarchy_utils.ensure_group(
            self.face_master_grp
        )

        # -------------------------------------------------------------------------
        # Step 02：创建 Model 主组，并挂到 Face Master 下
        # -------------------------------------------------------------------------
        self.face_model_grp = hierarchy_utils.ensure_group(
            self.face_model_grp,
            parent_node=self.face_master_grp
        )

        # -------------------------------------------------------------------------
        # Step 03：创建 Face 类型层级，并逐项保存真实场景路径
        # -------------------------------------------------------------------------
        self.face_guide_grp = hierarchy_utils.ensure_group(
            self.face_guide_grp,
            parent_node=self.face_master_grp
        )
        self.face_ctrl_grp = hierarchy_utils.ensure_group(
            self.face_ctrl_grp,
            parent_node=self.face_master_grp
        )
        self.face_jnt_grp = hierarchy_utils.ensure_group(
            self.face_jnt_grp,
            parent_node=self.face_master_grp
        )
        self.face_rig_nodes_grp = hierarchy_utils.ensure_group(
            self.face_rig_nodes_grp,
            parent_node=self.face_master_grp
        )
        self.face_pos_driver_grp = hierarchy_utils.ensure_group(
            self.face_pos_driver_grp,
            parent_node=self.face_master_grp
        )

        # -------------------------------------------------------------------------
        # Step 04：创建 Head Work Model 层级，并保存真实场景路径
        # -------------------------------------------------------------------------
        self.face_tweak_grp = hierarchy_utils.ensure_group(
            self.face_tweak_grp,
            parent_node=self.face_model_grp
        )
        self.face_stretch_grp = hierarchy_utils.ensure_group(
            self.face_stretch_grp,
            parent_node=self.face_model_grp
        )
        self.face_deform_grp = hierarchy_utils.ensure_group(
            self.face_deform_grp,
            parent_node=self.face_model_grp
        )

        # -------------------------------------------------------------------------
        # Step 05：刷新公共 Group 列表，后续 Module 统一复用真实 Long Path
        # -------------------------------------------------------------------------
        self.type_groups = [
            self.face_guide_grp,
            self.face_ctrl_grp,
            self.face_jnt_grp,
            self.face_rig_nodes_grp,
            self.face_pos_driver_grp,
        ]
        self.model_groups = [
            self.face_tweak_grp,
            self.face_stretch_grp,
            self.face_deform_grp,
        ]

        return True
'''

          if old not in source:
              raise RuntimeError("没有找到预期的 FaceBase.ensure_hierarchy() 旧实现。")

          updated = source.replace(old, new, 1)
          path.write_text(updated, encoding="utf-8")

      - name: Compile runtime and tests
        run: python -m compileall -q app core systems tools ui tests __init__.py config.py

      - name: Run static contracts
        run: |
          python tests/core_import_style_test.py
          python tests/core_public_api_gate_test.py
          python tests/core_single_source_gate_test.py
          python tests/rig_architecture_gate_test.py
          python tests/rig_base_contract_test.py
          python tests/module_base_contract_test.py
          python tests/system_core_reuse_gate_test.py
          python tests/maya2023_smoke_contract_test.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit Face hierarchy fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Face hierarchy fix already applied."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems/face/face_base.py
          git commit -m "fix: keep namespace-safe face hierarchy paths"
          git push origin HEAD:refactor/full-code-cn-comments
