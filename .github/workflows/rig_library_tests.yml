name: Rig Library Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rig-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: muziToolset
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check configuration and build orchestration
        run: python muziToolset/tests/rig_library_test.py
      - name: Install Qt for UI checks
        run: python -m pip install 'PySide6-Essentials>=6.5,<7'
      - name: Check real Qt layout and interactions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python muziToolset/tests/rig_library_qt_test.py
      - name: Compile changed runtime
        run: python -m compileall -q muziToolset/systems/rig muziToolset/core/common/transform_utils.py
