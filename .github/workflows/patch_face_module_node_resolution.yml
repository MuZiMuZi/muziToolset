name: Patch Face Module Node Resolution

on:
  push:
    branches:
      - refactor/full-code-cn-comments
    paths:
      - scripts/patch_face_module_node_resolution.py
      - .github/workflows/patch_face_module_node_resolution.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/full-code-cn-comments
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply Face module node resolution patch
        run: python scripts/patch_face_module_node_resolution.py

      - name: Compile runtime and tests
        run: python -m compileall -q systems tests

      - name: Validate Face lifecycle contract
        run: python tests/face_module_lifecycle_contract_test.py

      - name: Validate Face Maya smoke contract
        run: python tests/face_modules_maya2023_smoke_contract_test.py

      - name: Validate runtime step comments
        run: python scripts/annotate_runtime_steps.py --check

      - name: Validate public runtime docstrings
        run: python scripts/normalize_runtime_docstrings.py --check

      - name: Check whitespace errors
        run: git diff --check

      - name: Remove one-time patch script
        run: git rm scripts/patch_face_module_node_resolution.py

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems tests

          if git diff --cached --quiet; then
            echo "No Face module node resolution changes required."
            exit 0
          fi

          git commit -m "fix: resolve namespaced and reparented face nodes"
          git push origin HEAD:refactor/full-code-cn-comments
