name: Normalize Runtime Docstrings

on:
  push:
    branches:
      - refactor/runtime-docstring-standard

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refactor/runtime-docstring-standard
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 第一轮结构化 Docstring 已经写入分支。
      # 这里不再重复 --write，避免已有 Example / Notes 产生无意义缩进变化。
      - name: Validate public runtime docstrings
        run: python scripts/normalize_runtime_docstrings.py --check

      - name: Refine Maya and rigging parameter semantics
        run: python scripts/refine_runtime_docstring_semantics.py --write

      - name: Normalize runtime whitespace
        shell: bash
        run: |
          find app core systems tools ui -type f -name '*.py' -print0 | xargs -0 sed -i 's/[[:space:]]\+$//'
          sed -i 's/[[:space:]]\+$//' __init__.py config.py

      - name: Validate rigging terminology quality
        run: python scripts/refine_runtime_docstring_semantics.py --check

      - name: Compile runtime source
        shell: bash
        run: |
          python -m compileall -q app core systems tools ui __init__.py config.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit refined runtime documentation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Runtime docstrings already satisfy the semantic standard."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add __init__.py config.py app core systems tools ui
          git commit -m "docs: refine maya rigging api semantics"
          git push origin HEAD:refactor/runtime-docstring-standard
