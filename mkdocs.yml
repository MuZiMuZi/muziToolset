site_name: MuziTools
site_description: Maya 2023 Rigging Toolset - 用户手册、开发指南与完整 API Reference
site_author: MuziTools
site_url: https://muzimuzi.github.io/muziToolset/
repo_name: MuZiMuZi/muziToolset
repo_url: https://github.com/MuZiMuZi/muziToolset
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

# =============================================================================
# Theme
# =============================================================================
#
# 文档信息架构参考任务导向的用户手册：
#   1. 用户先从“我要做什么”进入；
#   2. API Reference 再负责完整技术细节；
#   3. 左侧导航保持源码层级，右侧 TOC 展开到 Method。
#
# 不复制任何外部网站视觉样式，只借鉴清晰、渐进式的信息组织方式。
# =============================================================================
theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

# =============================================================================
# Plugins
# =============================================================================
plugins:
  - search:
      lang:
        - zh
        - en
  - literate-nav:
      nav_file: SUMMARY.md

# =============================================================================
# Markdown
# =============================================================================
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# =============================================================================
# Styling
# =============================================================================
extra_css:
  - stylesheets/manual.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MuZiMuZi/muziToolset

copyright: Copyright © MuziTools
