site_name: MuziTools
site_description: Maya 2023 Rigging Toolset - 用户手册、开发指南与完整 API Reference
site_author: MuziTools
site_url: __MUZI_MAYA_JNT_PROTECTED_00000__
repo_name: MuZiMuZi/muziToolset
repo_url: __MUZI_MAYA_JNT_PROTECTED_00001__
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site
use_directory_urls: true
strict: true

# =============================================================================
# Theme
# =============================================================================
#
# 文档与 Maya UI 共用同一套 MuziTools 信息设计原则：
#   1. clean / calm；
#   2. sidebar-first；
#   3. 用留白、层级和柔和 Surface 组织内容；
#   4. 关键操作和 Active State 必须清晰；
#   5. Arc Browser 只作为交互与信息组织参考，不复制品牌素材。
# =============================================================================
theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

# =============================================================================
# Plugins
# =============================================================================
plugins:
  - search:
      lang:
        - zh
        - en
  - literate-nav:
      nav_file: SUMMARY.md

# =============================================================================
# Markdown
# =============================================================================
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# =============================================================================
# Styling
# =============================================================================
extra_css:
  - stylesheets/manual.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: __MUZI_MAYA_JNT_PROTECTED_00002__

copyright: Copyright © MuziTools
